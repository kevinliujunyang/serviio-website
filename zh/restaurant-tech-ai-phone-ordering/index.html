4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none transition" required><option value="">请选择主要痛点</option><option>高峰期漏接电话</option><option>普通话/粤语/英文双语电话</option><option>手动录入 POS</option><option>下班后电话</option><option>菜单问题或订单修改</option><option>其他</option></select></div><div><label for="pos_recommendation_interest" class="block text-sm font-medium text-gray-700 mb-2">如果还没有 POS，是否需要 POS 推荐？</label><select id="pos_recommendation_interest" name="pos_recommendation_interest" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none transition" required><option value="">请选择</option><option>希望了解 POS 推荐</option><option>只需要 AI 电话接单</option><option>不适用，我已经有 POS</option></select></div><div><label for="pos_purchase_timeline" class="block text-sm font-medium text-gray-700 mb-2">如果需要 POS 推荐，计划什么时候选择 POS？</label><select id="pos_purchase_timeline" name="pos_purchase_timeline" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none transition" required><option value="">选择时间</option><option>马上</option><option>1 个月内</option><option>1-3 个月</option><option>3-6 个月</option><option>还不确定</option><option>不适用，已经有 POS</option></select></div><button type="submit" class="w-full gradient-bg text-white py-4 rounded-lg font-semibold text-lg hover:opacity-90 transition">检查餐馆科技适配</button></form></div></div></section>
